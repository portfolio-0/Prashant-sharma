<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 494 494" width="494" height="494">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181818" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0e0e0e" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8d4a"/>
      <stop offset="100%" stop-color="#ff5e13"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="247" cy="247" r="238" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" stroke-opacity="0.3" filter="url(#glow)"/>

  <!-- Main Background Disc -->
  <circle cx="247" cy="247" r="232" fill="url(#bg-grad)" stroke="url(#primary-grad)" stroke-width="3"/>

  <!-- Camera Lens Aperture Ring -->
  <circle cx="247" cy="247" r="216" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 6"/>
  <circle cx="247" cy="247" r="204" fill="none" stroke="url(#primary-grad)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Inner Core Disc -->
  <circle cx="247" cy="247" r="160" fill="#121212" stroke="url(#primary-grad)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Center PS Monogram -->
  <text x="247" y="215" font-family="'Syne', 'Inter', sans-serif" font-size="112" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-4">PS</text>

  <!-- Accent Divider -->
  <rect x="177" y="238" width="140" height="3" rx="1.5" fill="url(#primary-grad)"/>
  <circle cx="247" cy="239.5" r="5" fill="#ffffff"/>

  <!-- Brand Name -->
  <text x="247" y="274" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="url(#primary-grad)" text-anchor="middle" letter-spacing="4">PRASHANT SHARMA</text>

  <!-- Title & Disciplines -->
  <text x="247" y="304" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#b0b0b0" text-anchor="middle" letter-spacing="3">CINEMATOGRAPHER &amp; VIDEO EDITOR</text>

  <!-- Experience Badge -->
  <rect x="172" y="322" width="150" height="24" rx="12" fill="rgba(255, 116, 37, 0.15)" stroke="url(#primary-grad)" stroke-width="1"/>
  <text x="247" y="338" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ff8d4a" text-anchor="middle" letter-spacing="2">15+ YEARS EXPERIENCE</text>
</svg>